name: Build Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:6.0.7

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Verify Emscripten
        run: emcc --version
      - name: Build web version
        run: |
          mkdir -p build/web
          emcc Main.c --use-port=sdl2 -o build/web/index.html
          ls -la build/web
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4