name: Build Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:6.0.7

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Verify Emscripten
        run: emcc --version